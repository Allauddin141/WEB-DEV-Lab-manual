<!DOCTYPE html>
<html>
<head>
    <title>Lab 4 - CSS Types</title>

    <!-- External CSS Link -->
    <link rel="stylesheet" type="text/css" href="style_lab4.css">

    <!-- Internal CSS -->
    <style>
        h2 {
            color: red;
            font-family: Arial, sans-serif;
        }

        .internal-paragraph {
            font-size: 16px;
            line-height: 1.5;
            color: darkgreen;
        }
    </style>
</head>

<body>

    <!-- INLINE CSS -->
    <h1 style="color: blue; text-align: center;">
        Welcome to Lab 4 (Inline CSS Example)
    </h1>

    <p style="color: purple; font-size: 18px;">
        This paragraph is styled using INLINE CSS.
    </p>

    <hr>

    <!-- INTERNAL CSS -->
    <h2>Internal CSS Example</h2>

    <p class="internal-paragraph">
        This paragraph is styled using INTERNAL CSS defined inside the &lt;style&gt; tag.
    </p>

    <hr>

    <!-- EXTERNAL CSS -->
    <h3>External CSS Example</h3>

    <p>
        This paragraph is styled using EXTERNAL CSS file (style.css).
    </p>

</body>
</html>
